# Собрано deploy.sh → /etc/nginx/sites-available/gpt-voice-pbx
# Мост доступен только с адресов из BRIDGE_ALLOW (.env) и только с токеном (проверяет диалер).
server {
    listen 80;
    server_name @@BRIDGE_DOMAIN@@;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name @@BRIDGE_DOMAIN@@;
    ssl_certificate /etc/letsencrypt/live/@@BRIDGE_DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@BRIDGE_DOMAIN@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / { return 404; }

    location /pbx/ {
@@ALLOW_LINES@@
        deny all;
        proxy_pass http://127.0.0.1:8130;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
