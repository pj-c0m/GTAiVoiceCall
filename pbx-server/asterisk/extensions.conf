; Собрано deploy.sh. Исходящие идут напрямую через ARI (originate → Stasis),
; диалплан нужен только чтобы отбивать всё входящее.
[general]
static=yes
writeprotect=yes
clearglobalvars=no

[from-pbx]
; Входящие от АТС на наш добавочный не обслуживаем — робот только звонит сам.
exten => _[0-9+*#].,1,NoOp(Входящий от АТС на ${EXTEN} — отклонён)
 same => n,Hangup(21)
exten => s,1,Hangup(21)

[gpt-test]
; Самопроверка моста без телефонии. Сюда можно попасть только из ARI (Local/sim1@gpt-test):
; канал изображает абонента — играет заготовленные реплики и пишет весь разговор.
exten => sim1,1,Answer()
 same => n,Wait(1)
 same => n,MixMonitor(gpt-test-${EPOCH}.wav)
 same => n,Playback(/srv/gpt-voice-dialer/sounds/sim1-1)
 same => n,Wait(12)
 same => n,Playback(/srv/gpt-voice-dialer/sounds/sim1-2)
 same => n,Wait(16)
 same => n,Playback(/srv/gpt-voice-dialer/sounds/sim1-3)
 same => n,Wait(18)
 same => n,Playback(/srv/gpt-voice-dialer/sounds/sim1-4)
 same => n,Wait(8)
 same => n,Hangup()
