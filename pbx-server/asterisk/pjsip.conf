; Собрано deploy.sh из pbx-server/asterisk/pjsip.conf — не править на сервере руками.
; Единственная задача этого Asterisk: быть внутренним номером @@EXT@@ в АТС
; и звонить через АТС по команде ARI. Никаких гостевых или анонимных endpoint'ов.

[global]
type=global
user_agent=Asterisk
endpoint_identifier_order=ip,username
default_realm=@@PBX_DOMAIN@@

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=@@PUBLIC_IP@@
external_media_address=@@PUBLIC_IP@@

; ── АТС: регистрация внутренним номером ────────────────────────────
[obpx_auth]
type=auth
auth_type=userpass
username=@@EXT@@
password=@@SIP_PASSWORD@@

[obpx_aor]
type=aor
contact=sip:@@PBX_DOMAIN@@:@@PBX_PORT@@

[obpx_endpoint]
type=endpoint
transport=transport-udp
context=from-pbx
outbound_auth=obpx_auth
aors=obpx_aor
from_user=@@EXT@@
from_domain=@@PBX_DOMAIN@@
disallow=all
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
t38_udptl=no
send_pai=no
trust_id_inbound=no

; Входящие INVITE считаем «от АТС» только с её адресов
[obpx_identify]
type=identify
endpoint=obpx_endpoint
match=@@PBX_IP@@

[obpx_registration]
type=registration
outbound_auth=obpx_auth
server_uri=sip:@@PBX_DOMAIN@@:@@PBX_PORT@@
client_uri=sip:@@EXT@@@@@PBX_DOMAIN@@
contact_user=@@EXT@@
retry_interval=60
forbidden_retry_interval=300
expiration=@@EXPIRATION@@
line=yes
endpoint=obpx_endpoint
